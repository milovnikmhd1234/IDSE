<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odkazy | IDSE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        .links-grid {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #ddd;
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            background-color: #5865F2; /* Discord modrá */
            color: white;
            border-color: #5865F2;
        }
        .back-button {
            margin-top: 40px;
            text-decoration: none;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Užitečné odkazy</h1>
        <p>Připojte se k naší komunitě nebo sledujte naše projekty.</p>

        <div class="links-grid">
            <!-- Discord Odkaz -->
            <a href="https://discord.gg/Wg8pzmx6gz" class="link-card" target="_blank">
                Official IDSE Discord Server
            </a>

            <!-- Hlavní web -->
            <a href="index.html" class="link-card">
                Zpět na hlavní stránku IDSE
            </a>
        </div>

        <a href="index.html" class="back-button">← Zpět domů</a>
    </div>

</body>
</html>
